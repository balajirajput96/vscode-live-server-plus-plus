name: Notify n8n on Push

on:
  push:
    branches: [main, master]
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  notify-n8n:
    runs-on: ubuntu-latest
    env:
      N8N_WEBHOOK_URL: ${{ secrets.N8N_WEBHOOK_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get commit info
        id: commit
        run: |
          set -euo pipefail
          {
            echo "sha=$(git rev-parse --short HEAD)"
            echo "message<<EOF"
            git log -1 --pretty=%B
            echo "EOF"
            echo "author=$(git log -1 --pretty=%an)"
          } >> "$GITHUB_OUTPUT"

      - name: Report unconfigured webhook
        if: ${{ env.N8N_WEBHOOK_URL == '' }}
        run: echo 'N8N_WEBHOOK_URL is not configured; n8n notification skipped.' >> "$GITHUB_STEP_SUMMARY"

      - name: Send notification to n8n
        if: ${{ env.N8N_WEBHOOK_URL != '' }}
        env:
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
          COMMIT_MESSAGE: ${{ steps.commit.outputs.message }}
          COMMIT_AUTHOR: ${{ steps.commit.outputs.author }}
          REPOSITORY: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          payload=$(jq -n \
            --arg query "Repository updated: ${COMMIT_MESSAGE}" \
            --arg email "2203456300001@paruluniversity.ac.in" \
            --arg type "repo_update" \
            --arg commit_sha "$COMMIT_SHA" \
            --arg author "$COMMIT_AUTHOR" \
            --arg repository "$REPOSITORY" \
            --arg branch "$BRANCH" \
            '{query:$query,email:$email,type:$type,commit_sha:$commit_sha,author:$author,repository:$repository,branch:$branch}')
          curl --fail-with-body --silent --show-error --location \
            --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 30 \
            -X POST "$N8N_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            --data "$payload"

      - name: Health check webhook
        if: ${{ env.N8N_WEBHOOK_URL != '' }}
        run: |
          set -euo pipefail
          response=$(curl --silent --show-error --location \
            --retry 3 --retry-delay 2 --connect-timeout 10 --max-time 30 \
            --output /tmp/n8n-health-response --write-out '%{http_code}' \
            -X POST "$N8N_WEBHOOK_URL" \
            -H 'Content-Type: application/json' \
            --data '{"type":"health","query":"ping","email":"2203456300001@paruluniversity.ac.in"}')
          case "$response" in
            2[0-9][0-9]) echo "n8n webhook healthy (HTTP $response)" ;;
            *) echo "n8n webhook returned HTTP $response"; cat /tmp/n8n-health-response; exit 1 ;;
          esac

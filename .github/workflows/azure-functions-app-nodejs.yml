name: Deploy Node.js project to Azure Function App

# Azure deployment is opt-in. Configure repository variables and the publish-profile
# secret before running this workflow manually.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type deploy to confirm an Azure deployment'
        required: true
        default: 'deploy'

permissions:
  contents: read

env:
  AZURE_FUNCTIONAPP_NAME: 'vscode-live-server-plus-plus'   # set this to your function app name on Azure
  AZURE_FUNCTIONAPP_PACKAGE_PATH: '.'       # set this to the path to your function app project, defaults to the repository root
  NODE_VERSION: '20.x'                      # set this to the node version to use (e.g. '8.x', '10.x', '12.x')

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate deployment configuration
        id: config
        env:
          AZURE_PUBLISH_PROFILE: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event.inputs.confirm }}" != "deploy" ]]; then
            echo 'Deployment confirmation was not provided; Azure deployment skipped.' >> "$GITHUB_STEP_SUMMARY"
            echo 'configured=false' >> "$GITHUB_OUTPUT"
          elif [[ -z "$AZURE_FUNCTIONAPP_NAME" || -z "$AZURE_PUBLISH_PROFILE" ]]; then
            {
              echo 'Azure deployment skipped because AZURE_FUNCTIONAPP_NAME or AZURE_FUNCTIONAPP_PUBLISH_PROFILE is not configured.'
              echo 'Set the repository variable and secret, then run this workflow manually with confirm=deploy.'
            } >> "$GITHUB_STEP_SUMMARY"
            echo 'configured=false' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: ${{ steps.config.outputs.configured == 'true' }}
        uses: actions/checkout@v4

      - name: Setup Node
        if: ${{ steps.config.outputs.configured == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install, build, and test
        if: ${{ steps.config.outputs.configured == 'true' }}
        working-directory: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
        run: |
          set -euo pipefail
          npm ci
          npm run build --if-present
          npm test --if-present

    - name: 'Run Azure Functions Action'
      uses: Azure/functions-action@v1
      id: fa
      with:
        app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
        package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
        publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }} # Remove publish-profile to use Azure RBAC